name: Generate terraform docs
on:
  push:
    branches:
      - master

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Install shell verifiers
      run: sudo apt-get update && sudo apt-get install --yes fish zsh

    - name: Install terraform-docs
      env:
        TERRAFORM_DOCS_VERSION: v0.21.0
        TERRAFORM_DOCS_SHA256: 2fdd81b8d21ff1498cd559af0dcc5d155835f84600db06d3923e217124fc735a
      run: |
        curl -fsS --proto '=https' --proto-redir '=https' --tlsv1.2 --location \
          --retry 3 --retry-all-errors --connect-timeout 20 --max-time 300 \
          --max-filesize 104857600 -o /tmp/terraform-docs.tar.gz \
          "https://github.com/terraform-docs/terraform-docs/releases/download/${TERRAFORM_DOCS_VERSION}/terraform-docs-${TERRAFORM_DOCS_VERSION}-linux-amd64.tar.gz"
        printf '%s  %s\n' "$TERRAFORM_DOCS_SHA256" /tmp/terraform-docs.tar.gz | sha256sum -c -
        tar -xzf /tmp/terraform-docs.tar.gz -C /tmp terraform-docs
        sudo install -m 0755 /tmp/terraform-docs /usr/local/bin/terraform-docs
        terraform-docs --version

    - name: Verify terraform docs are up to date
      run: |
        terraform-docs markdown table --config .terraform-docs.yml --output-mode inject --output-file docs/terraform.md .
        git diff -- docs/terraform.md
        git diff --exit-code -- docs/terraform.md

    - name: Verify generated site docs are up to date
      env:
        KH_REQUIRE_OPTIONAL_SHELLS: "1"
      run: |
        python3 scripts/sync_docs_site.py --check
        scripts/tests/test_generated_site_contract.sh
